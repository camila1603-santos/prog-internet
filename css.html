<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS</title>
    <style>
        p{
            font-size: 20pt;
        }
    </style>
</head>
<body>
    <h1>CSS</h1>
    <p>Css é uma linguagem declarativa auxiliar a documentos HTML para estilização de definição
        de comportamento. O css pode ser declarado de três formas distintas:
    </p>
    <ol>
        <li>Na tag style, definida no cabeçalho do HTML</li>
        <li>Em um documento externo por meio da tag link</li>
        <li>Inline no próprio elemento HTML</li>
    </ol>    
</body>
</html>
