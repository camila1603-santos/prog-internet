<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid</title>
    <style>
        *{
            border: 1px solid gray;
            margin: 0px;
            padding: 0px;
            box-sizing: content-box; 
        }

        .container{
            display: grid;
            grid-template-columns: 50px 1fr 2fr;
            grid-template-rows: 100px 500px 300px;
        }

        #box1{
            grid-column-start: 2;
            grid-column-end: 4;
            grid-row-start: 1;
            grid-row-end: 3;
            background-color: aqua;
        }
    </style>
</head>
<body>
    <!-- div.container>div.box#box$*10{box$} -->

    <div class="container">
        <div class="box" id="box1">box1</div>
        <div class="box" id="box2">box2</div>
        <div class="box" id="box3">box3</div>
        <div class="box" id="box4">box4</div>
        <div class="box" id="box5">box5</div>
        <div class="box" id="box6">box6</div>
        <div class="box" id="box7">box7</div>
        <div class="box" id="box8">box8</div>
        <div class="box" id="box9">box9</div>
        <div class="box" id="box10">box10</div>
    </div>
    
</body>
</html>
