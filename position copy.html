<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Positions</title>
    <style>

        *{border: 1px solid black;}

        .container{
            height: 200px;
            position: relative;
        }

        .box{
            position: static;
            top: 20px;
            height: 50px;
            width: 50px;
            display: inline-block;
        }

        #box1{
            position: fixed;
            top: 0px;
            left: 0px;
        }

        #box2{
            position: fixed; 
            right: 0px;
            top:0px;

        }

        #box3{
            position: fixed;
            top: 50px;
            right: 0px;
        }

        #box4{
            position: fixed;
            top: 50px;
            left: 0px;
        }

        #box5{
            position: fixed;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
        }

    </style>
</head>
<body>
    <h1>Positions</h1>
    <div class="container">
        <div class="box" id="box1">box-1</div>
        <div class="box" id="box2">box-2</div>
        <div class="box" id="box3">box-3</div>
        <div class="box" id="box4">box-4</div>
        <div class="box" id="box5">box-5</div>
    </div>
</body>
</html>
