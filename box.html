<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Model Box</title>
    <style>

        *{
            border: 1px solid black
        }


        html{
            background-color: gray;
            padding: 0px;
            margin: 0px;
        }

        body{
            margin: 10px;
            background-color: beige;
        }

        p{
            display: inline-block;
            width: 100px;
            height: 100px;
            padding: 10px;
            outline: 2px dotted purple;
            outline-offset: 2px;
            /* background-attachment: ;
            background-image: ; */
        }

        #joana{
            margin: 50px;
            border-top-color: red;
        }
        
    </style>
</head>
<body>
    <p>Thiago</p>
    <p>João</p>
    <p>Maria</p>
    <p id="joana">Joana</p>
    
</body>
</html>
