<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animate</title>
    <style>

        #rocket{
            position: fixed;
            animation: lancamento 10s linear 1s infinite;

        }

        #moon{
            position: fixed;
            animation: moon 10s linear 1s infinite;
        }

        @keyframes lancamento {
            0%{
                top: 100vh;
            }

            100%{
                top: -10vh;
            }
            
        }

        @keyframes moon {
            0%{
                right: 100vh;
            }

            100%{
                right: 0vh;
            }
            
        }
    </style>
</head>
<body>
    <p id="rocket">🚀</p>
    <p id="moon">🌙</p>
    
</body>
</html>
