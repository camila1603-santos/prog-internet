<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Positions</title>
    <style>

        *{border: 1px solid black;}

        .container{
            height: 200px;
            position: relative;
        }

        .box{
            position: relative;
            top: 20px;
            height: 50px;
            width: 50px;
            display: inline-block;
        }

        #box1{
            position: static;
            top: 10px;
        }

        #box2{
            /* relacionado a posição estática */
            position: relative; 
            top: 10px;
        }

        #box3{
            /* relacionado ao viewport do navegador */
            position: fixed;
            top: 200px;
            right: 400px;
        }

        #box4{
            /* relacionado ao primeiro ancestral não estático */
            position: absolute;
            top: 100px;
        }

    </style>
</head>
<body>
    <h1>Positions</h1>
    <div class="container">
        <div class="box" id="box1">box-1</div>
        <div class="box" id="box2">box-2</div>
        <div class="box" id="box3">box-3</div>
        <div class="box" id="box4">box-4</div>
        <div class="box" id="box5">box-5</div>
    </div>
</body>
</html>
